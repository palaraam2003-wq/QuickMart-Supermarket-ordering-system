# Microsoft SQL Server (database RapidMartDB, installed via database/RapidMartDB_SSMS.sql).
# Use the direct TCP port rather than a named instance so SQL Browser is not required.
spring.datasource.url=${RAPIDMART_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RapidMartDB;user=sa;password=1234;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${RAPIDMART_DB_USERNAME:sa}
spring.datasource.password=${RAPIDMART_DB_PASSWORD:1234}

# JPA / Hibernate schema validation (database schema is created manually via database/RapidMartDB_SSMS.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Logging
logging.level.com.rapidmart=DEBUG
logging.level.org.springframework.security=INFO

# Demo Initializer Flag
rapidmart.dev.seed-demo-manager=true

# Outgoing mail (bill emails). Unset by default -> no JavaMailSender bean, NotificationService logs
# a truthful NOT_SENT. Set these env vars to enable real SMTP delivery.
spring.mail.host=${RAPIDMART_MAIL_HOST:}
spring.mail.port=${RAPIDMART_MAIL_PORT:587}
spring.mail.username=${RAPIDMART_MAIL_USERNAME:}
spring.mail.password=${RAPIDMART_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${RAPIDMART_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${RAPIDMART_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${RAPIDMART_MAIL_SSL:false} 