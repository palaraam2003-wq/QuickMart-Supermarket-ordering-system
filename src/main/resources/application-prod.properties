# RapidMart Production Profile Configuration
# Microsoft SQL Server (database RapidMartDB, installed via database/RapidMartDB_SSMS.sql).
# All roles share this single database; override with environment variables.
spring.datasource.url=${RAPIDMART_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RapidMartDB;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${RAPIDMART_DB_USERNAME:rapidmart_app}
spring.datasource.password=${RAPIDMART_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate

# No demo initializer in production
rapidmart.dev.seed-demo-manager=false

# Outgoing mail (bill emails). Unset by default -> NotificationService logs a truthful NOT_SENT.
spring.mail.host=${RAPIDMART_MAIL_HOST:}
spring.mail.port=${RAPIDMART_MAIL_PORT:587}
spring.mail.username=${RAPIDMART_MAIL_USERNAME:}
spring.mail.password=${RAPIDMART_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${RAPIDMART_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${RAPIDMART_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${RAPIDMART_MAIL_SSL:false}

# Production security rules
server.error.include-message=never
server.error.include-stacktrace=never
