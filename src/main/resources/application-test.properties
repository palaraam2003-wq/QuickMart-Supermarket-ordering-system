# RapidMart Test Profile Configuration
# Tests run against a SEPARATE SQL Server database (RapidMartTestDB).
# Install it once in SSMS using database/RapidMartDB_SSMS.sql. Never point this at RapidMartDB.
# Windows Integrated Authentication: connects as the OS user running the tests.
spring.datasource.url=${RAPIDMART_TEST_DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=RapidMartTestDB;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate for tests
# The canonical SSMS script owns the schema, just as in dev/prod. Automatic update
# tried to alter indexed status/role columns and produced SQL Server DDL failures.
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.com.rapidmart=INFO

# Demo Initializer Flag (Disabled in test)
rapidmart.dev.seed-demo-manager=false
