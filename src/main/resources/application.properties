# RapidMart Default Application Configuration
spring.profiles.active=dev
spring.application.name=rapid-mart
spring.jackson.serialization.indent-output=true

# Server Settings
server.port=${RAPIDMART_PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=always
server.error.include-binding-errors=always

# RapidMart App Settings
rapidmart.timezone=UTC
rapidmart.currency=LKR
rapidmart.loyalty.points-per-lkr=0.01
rapidmart.loyalty.lkr-per-point=1.00

# Order pricing: tax rate applied to the discounted merchandise value, plus a flat delivery charge.
# Both default to zero (no behavior change) and are overridable per environment.
rapidmart.tax.rate-percentage=${RAPIDMART_TAX_RATE:0}
rapidmart.delivery.charge=${RAPIDMART_DELIVERY_CHARGE:0.00}

# Outgoing bill emails: unset by default (NotificationService truthfully logs NOT_SENT until configured)
rapidmart.mail.from=${RAPIDMART_MAIL_FROM:no-reply@rapidmart.local}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Health is public but never discloses credentials, component names or error details.
# A database outage affects readiness, not liveness (avoid pointless restart loops).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false

# Bound connection waits and recover idle SQL Server connections after an outage.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=120000

# Keep long-running instances from filling the disk with logs.
logging.file.name=${RAPIDMART_LOG_FILE:logs/rapidmart.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.clean-history-on-start=true
