<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidMart — Feedback</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">🛒 Rapid<span>Mart</span></a>
        <ul class="nav-links">
            <li><a href="/catalogue.html">Catalogue</a></li>
            <li><a href="/rewards.html">Rewards</a></li>
            <li><a href="/feedback.html" class="active">Feedback</a></li>
        </ul>
        <div id="user-nav" class="nav-links"></div>
    </nav>

    <main class="container" style="max-width: 820px;">
        <h2>Customer Feedback</h2>

        <section class="glass-card mt-2">
            <h3>Submit New Feedback</h3>
            <form id="feedback-form" class="mt-1" novalidate>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" class="form-control" required>
                        <option value="DELIVERY">Delivery Experience</option>
                        <option value="PRODUCT_QUALITY">Product Quality</option>
                        <option value="APP_ISSUE">App Issue / Bug</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" class="form-control" required maxlength="255">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" class="form-control" rows="4" required maxlength="5000"></textarea>
                </div>
                <button type="submit" id="feedback-btn" class="btn btn-primary">Submit Feedback</button>
            </form>
        </section>

        <section class="glass-card section">
            <h3>Your Feedback &amp; Manager Replies</h3>
            <div id="feedback-list" class="mt-1"><p class="muted">Loading…</p></div>
        </section>
    </main>

    <script>
        async function loadFeedback() {
            const container = document.getElementById('feedback-list');
            try {
                const list = await API.request('/api/v1/customer/feedback');
                if (!list.length) {
                    container.innerHTML = '<p class="muted">You have not submitted any feedback yet.</p>';
                    return;
                }
                container.innerHTML = list.map(f => `
                    <div class="panel">
                        <div class="row-between">
                            <strong>[${UI.escape(f.category)}] ${UI.escape(f.subject)}</strong>
                            ${UI.statusBadge(f.status)}
                        </div>
                        <p class="muted small">${UI.formatDateTime(f.createdAt)}</p>
                        <p style="margin: 0.5rem 0; white-space: pre-wrap;">${UI.escape(f.message)}</p>
                        ${f.replies.length ? `
                            <div style="margin-top: 0.75rem; padding-left: 1rem; border-left: 2px solid var(--accent-secondary);">
                                ${f.replies.map(r => `
                                    <div class="small" style="margin-bottom: 0.5rem;">
                                        <strong>Reply from ${UI.escape(r.repliedByName)}</strong> <span class="muted">${UI.formatDateTime(r.createdAt)}</span>
                                        <div style="white-space: pre-wrap;">${UI.escape(r.replyMessage)}</div>
                                    </div>`).join('')}
                            </div>` : ''}
                    </div>`).join('');
            } catch (e) {
                UI.setError(container, 'Could not load feedback.');
            }
        }

        document.getElementById('feedback-form').addEventListener('submit', async e => {
            e.preventDefault();
            const body = {
                category: document.getElementById('category').value,
                subject: document.getElementById('subject').value.trim(),
                message: document.getElementById('message').value.trim()
            };
            if (!body.subject || !body.message) return UI.showToast('Subject and message are required.', 'warning');

            await UI.withBusy(document.getElementById('feedback-btn'), async () => {
                try {
                    await API.request('/api/v1/customer/feedback', { method: 'POST', body });
                    UI.showToast('Feedback submitted!', 'success');
                    document.getElementById('feedback-form').reset();
                    await loadFeedback();
                } catch (err) { /* toast shown */ }
            });
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (await Auth.requireRole(['CUSTOMER'])) {
                loadFeedback();
                UI.liveRefresh(loadFeedback);
            }
        });
    </script>
</body>
</html>
