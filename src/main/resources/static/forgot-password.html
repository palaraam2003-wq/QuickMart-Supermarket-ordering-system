<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RapidMart - Reset password</title><link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script><script src="/js/ui.js"></script></head>
<body><main class="container" style="max-width:480px;margin-top:3rem"><section class="glass-card">
<h1>Reset customer password</h1><p>Receive a six-digit code by email. Codes expire after 10 minutes. Allow one minute before requesting another.</p>
<form id="request-form"><label for="email">Customer email</label><input id="email" type="email" class="form-control" required maxlength="254" autocomplete="email">
<button id="send-code" class="btn btn-primary" type="submit">Send code</button></form>
<p id="reset-status" role="status" aria-live="polite"></p>
<form id="reset-form" hidden>
<div class="form-group"><label for="otp">Email code</label><input id="otp" class="form-control" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
<div class="form-group"><label for="new-password">New password (8–72 characters)</label><input id="new-password" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required></div>
<div class="form-group"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required></div>
<button id="reset-button" type="submit" class="btn btn-primary">Change password</button></form>
<p><a href="/login.html">← Back to customer login</a></p></section></main>
<script src="/js/password-reset.js"></script></body></html>
