<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidMart &mdash; Inventory Products</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/inventory/inventory.css">
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body data-inventory-page="products">
    <nav class="navbar">
        <a href="/" class="brand">&#128722; Rapid<span>Mart</span> <span class="badge badge-info">INVENTORY</span></a>
        <div id="user-nav" class="nav-links"></div>
    </nav>
    <main class="container">
        <header class="inventory-heading">
            <div><h2>Products</h2><p class="muted page-intro">Maintain product details, prices, availability, and opening stock.</p></div>
            <button type="button" id="new-product" class="btn btn-primary">+ New Product</button>
        </header>
        <nav id="inventory-section-nav" class="inventory-tabs" aria-label="Inventory sections"></nav>

        <form id="product-form" class="glass-card section" hidden novalidate>
            <div class="row-between"><h3 id="product-form-title">New Product</h3><button type="button" id="product-cancel" class="btn btn-secondary btn-sm">Cancel</button></div>
            <input type="hidden" id="productEditId">
            <div class="grid-2 mt-1">
                <div class="form-group"><label for="sku">SKU</label><input type="text" id="sku" class="form-control" required maxlength="100" placeholder="MILK-101"></div>
                <div class="form-group"><label for="pname">Product Name</label><input type="text" id="pname" class="form-control" required maxlength="200"></div>
            </div>
            <div class="grid-3">
                <div class="form-group"><label for="price">Price (LKR)</label><input type="number" step="0.01" min="0.01" id="price" class="form-control" required></div>
                <div class="form-group"><label for="unit">Unit</label><input type="text" id="unit" class="form-control" required maxlength="50" placeholder="1 L"></div>
                <div class="form-group" id="initial-stock-group"><label for="initialStock">Initial Stock</label><input type="number" id="initialStock" class="form-control" min="0" max="1000" value="50"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label for="categoryId">Category</label><select id="categoryId" class="form-control" required></select></div>
                <div class="form-group"><label for="imageUrl">Image URL (optional)</label><input type="url" id="imageUrl" class="form-control" maxlength="500" placeholder="https://example.com/product.jpg"></div>
            </div>
            <div class="form-group"><label for="description">Description</label><input type="text" id="description" class="form-control" maxlength="1000"></div>
            <div class="form-group row"><input type="checkbox" id="productActive" checked><label for="productActive" style="margin: 0;">Active (available for sale)</label></div>
            <button type="submit" id="product-save" class="btn btn-success">Save Product</button>
        </form>

        <section class="glass-card section">
            <div class="inventory-search" role="search">
                <label for="product-search" class="sr-only">Search products</label>
                <input type="search" id="product-search" class="form-control" placeholder="Search by SKU, name, category, or status&hellip;" autocomplete="off">
                <span id="product-search-count" class="muted small" aria-live="polite"></span>
            </div>
            <div id="products-table-container" class="table-responsive"><p class="muted">Loading&hellip;</p></div>
        </section>
    </main>
    <script src="/inventory/inventory.js"></script>
</body>
</html>
