<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidMart — Register</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">🛒 Rapid<span>Mart</span></a>
        <ul class="nav-links">
            <li><a href="/catalogue.html">Catalogue</a></li>
        </ul>
    </nav>

    <main class="container" style="max-width: 480px; margin-top: 3rem;">
        <div class="glass-card">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Customer Registration</h2>
            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number (optional)</label>
                    <input type="tel" id="phone" class="form-control" autocomplete="tel" placeholder="+94770000000">
                </div>
                <div class="form-group">
                    <label for="password">Password (at least 6 characters)</label>
                    <input type="password" id="password" class="form-control" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" id="register-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
            </form>
            <p class="muted small" style="margin-top: 1.5rem; text-align: center;">
                Already have an account? <a href="/login.html" style="color: var(--accent-secondary);">Login here</a>
            </p>
        </div>
    </main>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            if (!fullName || !email) return UI.showToast('Name and email are required.', 'warning');
            if (!/^[^@\s]+@[^@\s]+\.com$/i.test(email)) return UI.showToast('Customer email must contain @ and end in .com.', 'warning');
            if (password.length < 6) return UI.showToast('Password must be at least 6 characters.', 'warning');

            await UI.withBusy(document.getElementById('register-btn'), async () => {
                try {
                    await API.request('/api/v1/auth/register', {
                        method: 'POST',
                        body: { fullName, email, phone: phone || null, password }
                    });
                    UI.showToast('Registration successful! Please log in.', 'success');
                    setTimeout(() => window.location.href = '/login.html', 1000);
                } catch (err) { /* toast shown by API client */ }
            });
        });
    </script>
</body>
</html>
