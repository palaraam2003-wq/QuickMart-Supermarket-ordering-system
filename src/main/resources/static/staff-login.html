<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RapidMart - Staff login</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">RapidMart</a>
        <a href="/login.html">Customer login</a>
    </nav>
    <main class="container" style="max-width:480px;margin-top:3rem">
        <section class="glass-card">
            <h1>Staff login</h1>
            <form id="staff-login" method="post">
                <div class="form-group">
                    <label for="email">Staff email</label>
                    <input id="email" name="email" type="email" class="form-control" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password">
                </div>
                <p id="login-error" class="text-danger" role="alert"></p>
                <button id="login-btn" class="btn btn-primary" type="submit">Sign in</button>
            </form>
        </section>
    </main>
    <script src="/js/staff-login.js"></script>
</body>
</html>
